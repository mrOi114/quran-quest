[functions.register-device]
verify_jwt = true

[functions.child-set-pin]
verify_jwt = true

[functions.child-verify-pin]
verify_jwt = true

# Public child path: family code + PIN, no parent email JWT on the child device.
[functions.resolve-family-code]
verify_jwt = false

[functions.child-unlock-with-code]
verify_jwt = false

[functions.send-family-push]
verify_jwt = true

# Guests have no auth JWT. Membership is the device participant key.
[functions.competition]
verify_jwt = false

# Guests claim a unique nickname across devices without an email session.
[functions.guest-name]
verify_jwt = false

# Guests have no auth JWT. Public top-30 student board uses the device participant key.
[functions.leaderboard]
verify_jwt = false

# Guests and students send feedback without an email JWT. Founder reads it from the app.
[functions.student-feedback]
verify_jwt = false
